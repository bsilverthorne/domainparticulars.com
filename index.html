<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain Particulars</title>
<meta name="description" content="Domain Particulars — coming soon.">
<style>
  :root {
    --accent: #3b4a6b;
    --accent-dark: #2c3850;
    --bg: #f6f7f8;
    --card: #ffffff;
    --border: #e3e5e8;
    --text: #1d2025;
    --muted: #687078;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%); color: #fff; padding: 34px 20px 28px; text-align: center; }
  header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
  header p { font-size: 14px; opacity: 0.85; margin-top: 6px; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-left: 5px solid var(--accent);
    border-radius: 12px; padding: 36px 40px; max-width: 460px; text-align: center;
  }
  .card h2 { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
  .card p { font-size: 14px; color: var(--muted); line-height: 1.6; }
  footer { text-align: center; padding: 22px 16px 28px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>Domain Particulars</h1>
    <p>Coming soon</p>
  </header>
  <main>
    <div class="card">
      <h2>The particulars are coming together.</h2>
      <p>This site is brand new. Check back soon.</p>
    </div>
  </main>
  <footer>&copy; 2026 Domain Particulars, LLC</footer>
</body>
</html>
